<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话 · HarnessGrad 实验台</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<style>
  .chat-shell { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .stream3 { flex: 1; overflow: auto; padding: 24px 0 8px; }
  .inner3 { max-width: 780px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }

  .turn { display: flex; gap: 12px; }
  .turn[data-who="user"] { flex-direction: row-reverse; }
  .who3 { width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center;
          font-size: 10.5px; font-weight: 700; background: var(--hg-alias-bg-layer-3); color: var(--hg-alias-label-secondary); }
  .turn[data-who="user"] .who3 { background: var(--hg-alias-label-primary); color: var(--hg-alias-bg-base); }
  .bubble { max-width: 78%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.65;
            border: 1px solid var(--hg-alias-border-l2); background: var(--hg-alias-bg-layer-1); }
  .turn[data-who="user"] .bubble { background: var(--hg-alias-bg-layer-3); border-color: transparent; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble code { background: var(--hg-alias-bg-base); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .bubble pre { margin: 8px 0 0; padding: 9px 11px; border-radius: 9px; background: var(--hg-alias-bg-base);
                border: 1px solid var(--hg-alias-border-l2); overflow: auto; font-size: 11.5px; }
  .meta3 { font-size: 10.5px; color: var(--hg-alias-label-secondary); margin-top: 6px; }
  .turn[data-who="user"] .meta3 { text-align: right; }

  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--hg-alias-label-secondary);
            animation: blink 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  .composer3 { padding: 8px 20px 18px; }
  .composer3 .box3 { max-width: 780px; margin: 0 auto; border: 1px solid var(--hg-alias-border-l2); border-radius: 16px;
                     background: var(--hg-alias-bg-layer-1); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 6px;
                     box-shadow: 0 1px 0 rgba(0,0,0,.02); }
  .composer3 .box3:focus-within { border-color: var(--hg-alias-border-l3); }
  .composer3 textarea { width: 100%; min-height: 40px; max-height: 160px; border: 0; background: transparent;
                        color: inherit; font: inherit; outline: none; resize: none; }
  .bar3 { display: flex; align-items: center; gap: 8px; }
  .hint3 { margin-left: auto; font-size: 10.5px; color: var(--hg-alias-label-secondary); }
  .chip3 { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 8px;
           border: 1px solid var(--hg-alias-border-l2); background: var(--hg-alias-bg-layer-2); font-size: 11px; }

  /* 技能卡：弹出 */
  .mask3 { position: fixed; inset: 0; background: rgba(10,12,16,.34); display: none; place-items: center; z-index: 40; }
  .mask3[data-open="true"] { display: grid; }
  .card3 { width: min(620px, 94vw); max-height: 88vh; overflow: auto; background: var(--hg-alias-bg-layer-1);
           border: 1px solid var(--hg-alias-border-l3); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.22); }
  .card3 h3 { margin: 0; padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--hg-alias-border-l2);
              display: flex; align-items: center; gap: 8px; }
  .card3 .body3 { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 8px 12px; align-items: center; font-size: 12px; }
  .grid3 label { color: var(--hg-alias-label-secondary); }
  .grid3 select, .grid3 input { font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 8px;
        border: 1px solid var(--hg-alias-border-l2); background: var(--hg-alias-bg-base); color: inherit; }
  .cmd3 { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--hg-alias-bg-base);
          border: 1px solid var(--hg-alias-border-l2); font-family: ui-monospace, Menlo, monospace;
          font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--hg-alias-label-secondary); }
  .card3 .foot3 { padding: 12px 16px; border-top: 1px solid var(--hg-alias-border-l2); display: flex; align-items: center; gap: 10px;
                  background: var(--hg-alias-bg-layer-2); border-radius: 0 0 16px 16px; }
  .state3 { font-size: 11.5px; } .state3[data-kind="ok"] { color: #2f7a4f; } .state3[data-kind="bad"] { color: #b4402f; }
  .empty3 { margin: auto; text-align: center; color: var(--hg-alias-label-secondary); font-size: 12.5px; padding: 40px 20px; }
  .empty3 b { color: var(--hg-alias-label-primary); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">HG</div>
      <div><div class="brand-name">HarnessGrad</div><div class="brand-sub">实验台</div></div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="/">实验 <span class="nav-badge" id="n3">—</span></a>
      <a class="nav-item" href="/#/trace">轨迹</a>
      <a class="nav-item" href="/#/version">版本</a>
    </nav>
    <div class="nav-group">
      <div class="nav-group-label">会话</div>
      <div id="sessions3" style="padding:0 2px"></div>
    </div>
    <div class="side-foot">
      <div class="status-line" id="st-model"><span class="status-dot"></span>…</div>
      <div class="status-line" id="st-driver"><span class="status-dot"></span>…</div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-shell">
      <div class="stream3"><div class="inner3" id="stream3"></div></div>
      <div class="composer3">
        <div class="box3">
          <textarea id="say" rows="1" placeholder="说句话,或者点下面的「跑实验」直接配一次运行"></textarea>
          <div class="bar3">
            <button class="chip3" id="open-skill">⚡ 跑实验</button>
            <span class="hint3">Enter 发送 · Shift+Enter 换行 · 起跑由平台执行,需二次确认</span>
            <button class="btn" data-variant="primary" id="send">发送</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="mask3" id="mask3">
  <div class="card3">
    <h3>⚡ 跑实验 <span style="font-weight:400;font-size:11.5px;color:var(--hg-alias-label-secondary)">配置 · 命令由服务端生成</span></h3>
    <div class="body3">
      <div class="grid3" id="fields3"></div>
      <pre class="cmd3" id="cmd3">（生成中…）</pre>
    </div>
    <div class="foot3">
      <span class="state3" id="state3"></span>
      <span style="margin-left:auto"></span>
      <button class="btn" id="close3">取消</button>
      <button class="btn" data-variant="primary" id="confirm3">确认启动</button>
    </div>
  </div>
</div>

<script src="/chat.js"></script>
<script src="/sidebar.js"></script>
</body>
</html>
