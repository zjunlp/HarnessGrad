<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ls.1">HarnessGrad · 启动</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">HG</div>
      <div><div class="brand-name">HarnessGrad</div><div class="brand-sub">优化 Harness</div></div></div>
    <nav class="nav"></nav>
    <div class="side-foot">
      <div class="status-line" id="st-model">…</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 data-i18n="ls.2">启动</h1>
      <span class="sub" data-i18n="ls.3">配置一次实验：数据集、harness、方法、轮数。命令由服务端生成，起跑前先预检。</span>
    </div>

    <div class="workshop" style="max-width:1080px">
      <div class="card" style="margin-bottom:14px">
        <div class="card__head"><span class="card__title" data-i18n="ls.4">这次跑什么</span>
          <span class="card__sub" id="preset-hint"></span></div>
        <div class="card__body">
          <div class="hg-stack" id="fields"></div>
        </div>
      </div>

      <details class="card" style="margin-bottom:14px">
        <summary class="card__head">创建自定义 RSI 方法 / Create a custom RSI method</summary>
        <div class="card__body hg-stack">
          <p>从无改动模板开始，修改 Python 代码后以新名称保存；模板本身不会调用模型或改进 Harness。</p>
          <label class="field"><span class="field__label">方法名称 / Method name</span><input class="input" id="custom-method-name" maxlength="48"></label>
          <button class="btn" type="button" id="load-method-template">加载模板 / Load template</button>
          <label class="field"><span class="field__label">run.py</span><textarea class="input hg-mono" id="custom-method-source" rows="16" spellcheck="false"></textarea></label>
          <button class="btn" type="button" id="create-method">保存新方法 / Save new method</button>
          <p id="method-create-status" role="status"></p>
        </div>
      </details>

      <div class="card">
        <div class="card__head"><span class="card__title" data-i18n="ls.5">命令</span>
          <span class="card__sub" data-i18n="ls.6">预检没过就不给起跑，理由写在下面</span></div>
        <div class="card__body">
          <pre class="wcmd" id="scope" aria-live="polite"></pre>
          <pre class="wcmd hg-mono" id="cmd">（参数齐了以后生成）</pre>
          <div class="hg-row launch-actions" style="margin-top:12px">
            <span class="badge" id="state" data-tone="wait">预检中…</span>
            <span class="spacer hg-grow"></span>
            <button class="btn btn--primary" type="button" id="go" disabled data-i18n="ls.9">确认启动</button>
          </div>
          <div id="result" hidden aria-live="polite" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/shell-i18n.js"></script>
<script src="/launch-i18n.js"></script>
<script src="/i18n.js"></script>
<script src="/shell.js" defer></script>
<script src="/launch-methods.js" defer></script>
<script src="/launch.js" defer></script>
</body>
</html>
