<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HarnessGrad · 重构工作区</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">HG</div>
      <div><div class="brand-name">HarnessGrad</div><div class="brand-sub">优化 Harness</div></div></div>
    <nav class="nav"></nav>
    <div class="side-foot">
      <div class="status-line">候选</div>
      <div class="status-line hg-mono" id="cand-root">…</div>
      <a class="side-link" href="/author.html#/scenarios">导入环境 ↗</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>编辑</h1>
      <span class="sub">选版本 → 选文件 → 在右侧和助手讨论，它按讨论改；改动落成候选，跑不跑由你决定</span>
      <span class="spacer"></span>
      <span class="badge" id="dirty" hidden>未保存</span>
      <button class="btn btn--sm" type="button" id="save">另存为候选</button>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start">
      <div class="workshop" style="max-width:100%;padding:14px 16px 24px">
        <div class="card">
          <div class="card__head" style="gap:10px">
            <span class="card__title">版本</span>
            <input class="input" id="source-search" placeholder="搜版本：候选名 / run id / 基线"
                   style="max-width:340px;padding:6px 9px;font-size:12px">
            <span class="card__sub" id="source-hint">按更新时间排列</span>
            <span class="spacer hg-grow"></span>
            <span class="hg-mono hg-muted" id="source-current">—</span>
          </div>
          <div class="hg-srcbar" id="source-list" role="listbox" aria-label="Harness 版本"></div>
          <details class="hg-history" id="history-wrap" hidden>
            <summary>历史 <span class="hg-muted" id="history-hint"></span></summary>
            <div class="hg-history__list" id="history-list"></div>
            <pre class="wlog hg-mono" id="history-patch" style="max-height:220px">选一轮看它的改动</pre>
            <label class="hg-row" style="gap:6px;font-size:12px;padding:6px 0">
              <input type="checkbox" id="history-attach">
              <span>把这段历史一起发给助手（它能看到每一轮加了什么）</span>
            </label>
          </details>
          <div class="card__body" style="display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;padding-top:10px">
            <div>
              <div class="hg-row" style="justify-content:space-between;margin-bottom:6px">
                <span class="field__label">文件</span>
                <span class="hg-mono hg-muted" id="files-count"></span>
              </div>
              <ul class="hg-stack" id="files" style="list-style:none;margin:0;padding:0;gap:1px"></ul>
              <div class="field" style="margin-top:12px">
                <label class="field__label" for="name">另存为</label>
                <input class="input" id="name" placeholder="my-refactor" spellcheck="false">
              </div>
            </div>
            <div>
              <div class="hg-row" style="justify-content:space-between;margin-bottom:6px">
                <span class="hg-mono hg-muted" id="editing">选一个文件</span>
                <span class="hg-mono hg-muted" id="lines"></span>
              </div>
              <textarea class="textarea" id="editor" spellcheck="false" rows="26"
                        style="font-family:var(--mono);font-size:12px;line-height:1.55"></textarea>
            </div>
          </div>
        </div>
      </div>

      <aside class="hg-chat">
        <div class="hg-chat__head">
          <b>助手</b>
          <select class="select" id="kind" style="width:auto">
            <option value="codex">codex</option>
            <option value="dsh">dsh</option>
            <option value="opencode">opencode</option>
            <option value="miniswe">miniswe</option>
            <option value="miniagent">miniagent</option>
            <option value="openclaw">openclaw</option>
          </select>
        </div>
        <div class="hg-chat__thread" id="thread">
          <div class="hg-chat__empty">说点什么：可以让它改代码，也可以只讨论。<br>
            选中行会跟着这一条消息一起发出去。</div>
        </div>
        <div class="hg-chat__compose">
          <div class="hg-row" id="chips" style="flex-wrap:wrap;gap:6px"></div>
          <textarea class="textarea" id="instruction" rows="3"
                    placeholder="例如：这段上下文预算和答案提取互相影响，请拆成两个函数；或者：先说说这段在做什么。"></textarea>
          <div class="hg-row">
            <span class="field__hint" id="send-state"></span>
            <span class="spacer hg-grow"></span>
            <button class="btn btn--accent btn--sm" type="button" id="send">发送</button>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>
<script src="/shell.js" defer></script>
<script src="/harness.js" defer></script>
</body>
</html>
