# The gate a stranger meets first: clone, no dependencies, run what the repository says.
#
# Two jobs, split by what they can *guarantee* on a machine that is not ours.
#
#   checks  gating. Documentation links and fenced commands, the lane split, this workflow's
#           own references, the import-direction rules, the reviewed adapter inventory, the
#           leaderboard record, the entrypoints, and the checkout's cleanliness afterwards.
#           Every one reads files in the checkout, so on any Linux box with Python and pytest
#           the answer is the same, and a red result is a change to fix.
#
#   report  advisory. The catalogue documents (DATASETS.md, the refusal declarations) and the
#           part of the suite this change can reach, through `tools/ci_select.py` and
#           `tools/run_tests.py --fast`. These depend on what the machine has -- optional
#           extras, provisioned datasets, a relay or a container runtime -- so a failure can
#           mean "this runner is bare" rather than "this change is wrong". The job still runs
#           them and still shows red; it may not fail the workflow, and it may not be quiet
#           either.
#
# Why the suite is selected rather than whole: it is ~750 s of real subprocess work, and a
# pull request that edits one adapter does not need the appworld scorer. `ci_select.py` maps
# a changed path to the tests that can reach it, always includes the guards, and falls back to
# the full suite for a core path or a change it cannot map -- a missed test is a bug in that
# file, a redundant one is a minute.
#
# Why that split is honest rather than convenient: a dataset that drops because `numpy` is
# absent is correct behaviour (the platform has no runtime dependencies on purpose), and a
# test file that needs a provisioned dataset should skip rather than pass. Gating on either
# would make the badge a statement about GitHub's image. `docs/release-validation.md` records
# the full four-shard run on a provisioned machine: that is the stronger claim, and it stays a
# local gate until dataset discovery stops depending on what is installed.
#
# No secrets are used and nothing is published, so a pull request from a fork is useful.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:07 UTC: the nightly full suite. A push runs only what it can reach, and this is the
    # job that keeps the whole tree measured -- once a day is enough for that claim, and a
    # twenty-minute suite must not sit in front of a one-line fix.
    - cron: '7 4 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (documentation, registry, packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The one thing installed for the gate. The platform is standard library only, on
      # purpose: `pyproject.toml` declares `dependencies = []` so an offline machine can
      # install it, and the step below asserts that claim on an interpreter with nothing
      # else added to it.
      - name: Test runner
        run: python3 -m pip install --quiet --disable-pip-version-check pytest

      - name: Standard library only
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          declared = project["dependencies"]
          assert declared == [], f"runtime dependencies are not allowed: {declared}"
          print("dependencies:", declared, "| requires-python:", project["requires-python"])
          PY

      # One pytest invocation per file, and a failed file is reported as an annotation that
      # carries its own tail: a single invocation makes a red step say "exit code 1" and
      # nothing else, and the log is readable only by someone with a token -- which is exactly
      # the position a contributor on a fork is in.
      - name: Documentation, registry and CI guards
        run: |
          status=0
          # pytest refuses a --basetemp whose parent does not exist, and it creates only the
          # leaf. One mkdir here is cheaper than one failing verb per test file.
          mkdir -p "$RUNNER_TEMP/pytest-checks"
          for file in \
            tests/quality/test_documentation_links.py \
            tests/quality/test_documentation_commands.py \
            tests/quality/test_ci_select.py \
            tests/quality/test_test_lanes.py \
            tests/quality/test_ci_workflow.py \
            tests/quality/test_import_direction.py \
            tests/quality/test_registry_broken_adapters.py \
            tests/quality/test_contributors.py ; do
            log="$RUNNER_TEMP/$(basename "$file" .py).log"
            if python3 -m pytest -q "$file" \
                 --basetemp="$RUNNER_TEMP/pytest-checks/$(basename "$file" .py)" > "$log" 2>&1 ; then
              echo "ok   $file"
            else
              status=1
              echo "FAIL $file"
              tail -n 40 "$log"
              detail=$(tail -n 12 "$log" | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=$file::$detail"
            fi
          done
          exit $status

      - name: Entrypoints import and answer help
        run: |
          python3 driver.py --help > /dev/null
          python3 -c "import driver, harnessgrad.cli; print('import: ok')"

      # A generator that writes into the checkout turns "green" into "green plus a diff a
      # reviewer has to notice". The tree must be as clean after the checks as before them.
      - name: The checkout is unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || {
            echo "::error::the checks wrote into the checkout:"
            git status --porcelain
            exit 1
          }

  report:
    name: Report (catalogue and suite)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test runner and the two optional adapter extras
        run: python3 -m pip install --quiet --disable-pip-version-check pytest numpy chess

      # Known, named gaps rather than a surprise: a red suite should be read with these in
      # mind, and a contributor should not have to infer them from a skip count.
      - name: What this runner cannot do
        run: |
          cat <<'EOF'
          - No provisioned dataset bytes: files that load a corpus without a fixture skip.
          - No agent or judge endpoint: model-facing smoke tests skip.
          - No docker image cache: container tasks that pull an image are slow or skip.
          - `--fast` drops the seven files measured at minutes each.
          The provisioned gate is the four-shard run in docs/release-validation.md.
          EOF

      - name: Catalogue documents
        run: |
          python3 tools/datasets_doc.py --check
          python3 tools/check_dataset_blockers.py

      - name: Adapters this machine can import
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from data.scaffolds import registry
          published = registry.published()
          broken = registry.broken_adapters()
          optional = ("ImportError", "ModuleNotFoundError", "FileNotFoundError")
          print(f"published: {len(published)} of {len(published) + len(broken)} declared")
          for name, error in sorted(broken.items()):
              kind = "optional" if error.startswith(optional) else "BROKEN"
              print(f"  {kind:8s} {name}: {error.splitlines()[0][:120]}")
          real = {name: error for name, error in broken.items()
                  if not error.startswith(optional)}
          assert not real, f"adapters raise for a reason that is not a missing extra: {real}"
          PY

      # `actions/checkout` fetches one commit, so the comparison base is an object this clone
      # does not have -- and `git diff base head` then yields nothing, which the selector has to
      # read as "everything changed" and defer. Fetching that one commit makes the selection
      # real; when it fails (a force-push, a deleted branch) the fallback is unchanged.
      - name: Fetch the comparison base
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no comparison base in this event"
          else
            git fetch --no-tags --depth=1 origin "$base" && \
              git cat-file -e "${base}^{commit}" && echo "base: $base" || \
              echo "::notice::the base commit $base could not be fetched; this change selects everything"
          fi

      # What this change can reach. A pull request compares against its base; a push compares
      # against the previous tip; a scheduled run has no base and measures the whole tree,
      # which is the point of running it nightly.
      - name: Plan the tests this change can reach
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            printf '{"base": null, "suite": [], "full": true, "changed": 0}\n' > plan.json
          else
            python3 tools/ci_select.py --base "$base" --head '${{ github.sha }}' \
              --plan plan.json --without-guards
          fi
          python3 tools/ci_select.py --describe plan.json

      # The suite runs from the plan, and only that: the first version passed the selection
      # through a shell string, where an empty value silently means "no --file at all" and
      # therefore the whole suite. A file cannot lose its contents that way.
      - name: Suite
        env:
          HG_TEST_TMPDIR: ${{ runner.temp }}/hg-pytest
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          # The full suite is deferred off the push path, not skipped: the nightly run and a
          # manual dispatch both ask for it explicitly. Every other event runs the selection.
          case '${{ github.event_name }}' in
            schedule|workflow_dispatch)
              python3 tools/run_selected.py --plan plan.json --jobs 4 --full ;;
            *)
              python3 tools/run_selected.py --plan plan.json --jobs 4 ;;
          esac

      # A change with no computable base (a force-push) or a core path selects everything.
      # That is the right *selection* and the wrong thing to block a push on: the full suite
      # is a nightly job now, and the nightly job (or a manual dispatch) is what runs it.
      - name: Full suite deferred to the nightly run
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('plan.json')).get('full') else 1)"; then
            echo "::notice::this change selects everything; the full suite runs nightly"
          fi
          true
