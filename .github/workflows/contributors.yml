# Contributor graphics are maintained by a human, not an automated push.
# Run `python3 tools/contributors.py --write` locally, review the diff and commit it.
name: Contributors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check contributor drawings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check committed graphics
        run: python3 tools/contributors.py --check
