# Website source lives on website; main remains the Python platform.
# The default-branch workflow with this same filename exposes manual dispatch.
# A website push builds the triggering commit, never a moving branch checkout.
name: Deploy site

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read legacy platform contributors record
        uses: actions/checkout@v4
        with:
          ref: main
          path: platform-record
          sparse-checkout: docs/contributors.html
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Preserve legacy platform contributors record
        run: |
          git -C platform-record rev-parse HEAD
          cp platform-record/docs/contributors.html dist/contributors.html
          pnpm check:links

      # One-time admin setting: Settings -> Pages -> Source: GitHub Actions.
      # Authorize website (and main for its dispatcher) in github-pages environment.
      # Never request enablement/admin permissions from the workflow token.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
