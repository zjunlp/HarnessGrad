"data.datasets.triviaqa" = ["runtime.json", "requirements-load.txt"]
"data.datasets.costbench" = ["execution-runtime.json", "requirements.lock"]
"data.datasets.locomo" = ["execution-runtime.json", "requirements.lock", "requirements-score.txt", "README.md"]
"data.datasets.locomo.specs" = ["source.json"]
"data.datasets.math" = ["execution-runtime.json", "requirements.lock", "requirements-score.txt"]
"data.datasets.chessbench_puzzles" = ["runtime.json", "requirements-load.txt", "README.md"]
"data.runtimes" = ["chessbench_puzzles-native.json"]
"data.scaffolds.native_qa" = ["PROVENANCE.json", "LICENSE.upstream", "README.md"]
"harnessgrad.improvers" = ["improvers.json", "launchable.json", "skill.md"]
"harnessgrad.runtime" = ["eight_stage_protocol.schema.json"]
"methods" = ["dsh-improver"]
